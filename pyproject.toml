[project]
name = "pdfsum"
version = "0.1.0"
description = "Local control-center CLI for the PDF Summarizer Agent (orchestration only; no local training or inference)"
requires-python = ">=3.10"
dependencies = [
    "pypdf>=4.0",
    "reportlab>=4.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pdfsum = "pdfsum.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
